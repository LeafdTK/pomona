<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomona</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- One shell for every step. Steps do not replace it, they change what it
       holds and how big it is, so moving between them reads as one thing
       turning over rather than a stack of pages taking turns. -->
  <main class="stage" id="stage">
    <div class="shell" id="shell">
      <header class="brand">
        <span class="brand__mark blossom" data-blossom aria-hidden="true"></span>
        <span class="brand__name">Pomona</span>
        <a class="brand__privacy" id="privacyLink" href="../privacy/privacy.html" target="_blank" rel="noopener">What it reads and keeps</a>
      </header>

      <div class="pane" id="pane"></div>

      <footer class="progress" id="progress" aria-hidden="true"></footer>
    </div>
  </main>

  <!-- ── Steps ─────────────────────────────────────────── -->

  <!-- Extension only: which server writes your brief. -->
  <template id="step-where">
    <div class="step">
      <p class="step__kicker">One page, every morning</p>
      <h1 class="step__title">Good morning.<br>Let's make you a brief.</h1>
      <p class="step__body">
        Pomona reads what you already have open, Slack, GitHub, your calendar, and writes one
        page about your day, ready before you sit down. It needs a server to do the reading.
        Nothing is stored in this browser but a key to yours.
      </p>
      <ul class="picks" id="servers"></ul>
      <div class="fields fields--custom" id="customServer" hidden>
        <label class="field field--wide">
          <span class="field__label">Server address</span>
          <input type="url" id="serverUrl" placeholder="https://pomona.example.com" spellcheck="false">
        </label>
      </div>
      <div class="step__actions">
        <button type="button" class="btn btn--primary" id="connectServer">Connect</button>
      </div>
      <p class="step__status" id="whereStatus"></p>
    </div>
  </template>

  <!-- A hosted server's front door: what this is, before anything is asked. -->
  <template id="step-welcome">
    <div class="step">
      <p class="step__kicker">One page, every morning</p>
      <h1 class="step__title">Good morning.<br>Let's make you a brief.</h1>
      <p class="step__body">
        Pomona reads what you already have open, Slack, GitHub, your calendar, and writes one
        page about your day, ready before you sit down: what is yours, what is being asked of
        you, what quietly lapsed. Claude writes it; you pay for your own Claude.
      </p>
      <p class="step__body" id="welcomeWhere"></p>
      <div class="step__actions">
        <button type="button" class="btn btn--primary" data-next>Start</button>
      </div>
    </div>
  </template>

  <template id="step-read">
    <div class="step">
      <p class="step__kicker">What it may read</p>
      <h1 class="step__title">Decide how much of Slack it sees.</h1>
      <p class="step__body">
        Slack itself enforces this: the token Pomona is given only carries the permissions for
        the line you pick, and the consent screen shows exactly these. You can widen or narrow
        it later by connecting again.
      </p>
      <ul class="tiers" id="tiers"></ul>
      <div class="step__actions">
        <button type="button" class="btn" data-back hidden>Back</button>
        <button type="button" class="btn btn--primary" data-next>Next</button>
      </div>
    </div>
  </template>

  <template id="step-signin">
    <div class="step">
      <p class="step__kicker">Who it's writing to</p>
      <h1 class="step__title">Sign in.</h1>
      <p class="step__body" id="signinBody">
        No password to invent. Slack signs you in and connects itself in the same click, with
        the permissions you just chose. Or have a code emailed to you and connect Slack later.
      </p>
      <div class="doors">
        <button type="button" class="btn btn--primary btn--door" id="slackDoor">Continue with Slack</button>
        <div class="door door--email" id="emailDoor">
          <label class="field">
            <span class="field__label">Email</span>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" spellcheck="false">
          </label>
          <button type="button" class="btn" id="sendCode">Email me a code</button>
        </div>
        <div class="door door--code" id="codeDoor" hidden>
          <label class="field">
            <span class="field__label">The six digits we sent</span>
            <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" spellcheck="false">
          </label>
          <button type="button" class="btn btn--primary" id="verifyCode">Sign in</button>
        </div>
      </div>
      <div class="step__actions">
        <button type="button" class="btn" data-back>Back</button>
      </div>
      <p class="step__status" id="signinStatus"></p>
    </div>
  </template>

  <template id="step-sources">
    <div class="step">
      <p class="step__kicker">What it reads</p>
      <h1 class="step__title">Give it something to read.</h1>
      <p class="step__body">
        One is enough to start. Everything is read-only, and you can take any of them away
        later without losing anything.
      </p>
      <ul class="picks" id="picks"></ul>
      <p class="step__status" id="pickNote"></p>
      <div class="step__actions">
        <button type="button" class="btn" data-back>Back</button>
        <button type="button" class="btn btn--primary" data-next>Next</button>
      </div>
    </div>
  </template>

  <template id="step-never">
    <div class="step">
      <p class="step__kicker">What it must never read</p>
      <h1 class="step__title">Anything off limits?</h1>
      <p class="step__body" id="neverBody">
        Tick a room and Pomona never fetches it: not summarised, not stored, not sent to
        Claude. This is decided before anything is read, so a ticked room costs nothing.
        Change it any time in settings.
      </p>
      <input type="search" id="roomSearch" class="rooms__search" placeholder="Find a channel" autocomplete="off" hidden>
      <ul class="rooms" id="rooms"></ul>
      <div class="step__actions">
        <button type="button" class="btn" data-back>Back</button>
        <button type="button" class="btn btn--primary" data-next>Next</button>
      </div>
    </div>
  </template>

  <template id="step-claude">
    <div class="step">
      <p class="step__kicker">Who writes it</p>
      <h1 class="step__title">Your own Claude.</h1>
      <p class="step__body" id="claudeBody"></p>
      <div class="fields" id="claudeFields" hidden>
        <label class="field field--wide">
          <span class="field__label">Anthropic API key</span>
          <input type="password" id="apiKey" placeholder="sk-ant-…" spellcheck="false" autocomplete="off">
          <span class="field__help">Stored encrypted on the server and sent only to api.anthropic.com. Roughly two dollars a morning on Opus; a fraction of that on Sonnet.</span>
        </label>
      </div>
      <div class="step__actions">
        <button type="button" class="btn" data-back>Back</button>
        <button type="button" class="btn btn--primary" data-next>Next</button>
      </div>
      <p class="step__status" id="claudeStatus"></p>
    </div>
  </template>

  <template id="step-when">
    <div class="step">
      <p class="step__kicker">When it's ready</p>
      <h1 class="step__title">Pick a morning.</h1>
      <p class="step__body" id="whenBody">
        It starts reading twenty minutes before this, so the page is finished when you open
        the browser, whether that is at seven or at quarter past nine.
      </p>
      <div class="fields">
        <label class="field">
          <span class="field__label">Ready by</span>
          <input type="time" id="time" value="07:00">
        </label>
        <label class="field field--check">
          <input type="checkbox" id="weekdays" checked>
          <span>Weekdays only</span>
        </label>
      </div>
      <div class="step__actions">
        <button type="button" class="btn" data-back>Back</button>
        <button type="button" class="btn btn--primary" data-next>Next</button>
      </div>
    </div>
  </template>

  <template id="step-done">
    <div class="step step--done">
      <p class="step__kicker">Ready</p>
      <h1 class="step__title" id="doneTitle">That's everything.</h1>
      <p class="step__body" id="doneBody">
        Pomona writes tomorrow's on its own. You can have today's now, if you like: it takes a
        few minutes, and it shows you the day's painting while it works.
      </p>
      <label class="field field--wide field--focus">
        <span class="field__label">Anything it can't work out on its own? (optional)</span>
        <textarea id="focus" rows="2" placeholder="What matters this month, and what to ignore."></textarea>
      </label>
      <div class="step__actions">
        <button type="button" class="btn btn--primary" id="writeNow">Write today's now</button>
        <button type="button" class="btn" id="later">I'll wait for the morning</button>
      </div>
      <p class="step__status" id="status"></p>
    </div>
  </template>

  <template id="tpl-pick">
    <li class="pick">
      <button type="button" class="pick__button">
        <span class="pick__mark" aria-hidden="true"></span>
        <span class="pick__main">
          <span class="pick__name"></span>
          <span class="pick__blurb"></span>
        </span>
        <span class="pick__state"></span>
      </button>
    </li>
  </template>

  <template id="tpl-tier">
    <li class="tier">
      <label class="tier__label">
        <input type="radio" name="tier" class="tier__radio">
        <span class="tier__main">
          <span class="tier__name"></span>
          <span class="tier__reads"></span>
        </span>
      </label>
    </li>
  </template>

  <template id="tpl-room">
    <li class="room">
      <label class="room__label">
        <input type="checkbox" class="room__check">
        <span class="room__name"></span>
      </label>
    </li>
  </template>

  <script type="module" src="welcome.js"></script>
</body>
</html>
